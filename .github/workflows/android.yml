name: Android checks
on:
 pull_request:
  types: [opened, synchronize, reopened, ready_for_review]
 push:
  branches: [main]
concurrency:
 group: android-${{ github.head_ref || github.ref }}
 cancel-in-progress: true
jobs:
 build:
  if: github.event_name == 'push' || !github.event.pull_request.draft
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
     with:
      packages: platform-tools
   - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
   - uses: gradle/actions/setup-gradle@v4
   - uses: actions/cache@v4
     with:
      path: |
       core/src/main/assets/models
       core/src/main/jniLibs
      key: speech-v1.13.8-${{ hashFiles('third_party/speech-downloads/*.json') }}
   - run: python3 scripts/prepare_speech.py
   - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
   - uses: actions/upload-artifact@v4
     with:
      name: rongban-debug
      path: app/build/outputs/apk/debug/*.apk
 instrumentation:
  if: github.event_name == 'push' || !github.event.pull_request.draft
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
     with:
      packages: platform-tools
   - uses: gradle/actions/setup-gradle@v4
   - uses: actions/cache@v4
     with:
      path: |
       core/src/main/assets/models
       core/src/main/jniLibs
      key: speech-v1.13.8-${{ hashFiles('third_party/speech-downloads/*.json') }}
   - run: python3 scripts/prepare_speech.py
   - run: |
      sudo sh -c 'echo KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\" > /etc/udev/rules.d/99-kvm4all.rules'
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - name: Detect device tests
     id: device_tests
     run: |
      if [ -d app/src/androidTest ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
   - uses: reactivecircus/android-emulator-runner@v2
     if: steps.device_tests.outputs.present == 'true'
     with:
      api-level: 35
      target: google_apis
      arch: x86_64
      profile: pixel_6
      ram-size: 2048M
      disable-animations: true
      script: ./gradlew connectedDebugAndroidTest
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: device-test-report
      path: app/build/reports/androidTests
